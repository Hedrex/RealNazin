name: Build REAL NAZIN APK

on:
  push:
    branches: [ "main" ]

# إعطاء صلاحية للروبوت لإنشاء رابط التحميل المباشر
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk REAL-NAZIN.apk

    - name: Create Direct APK Link
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: REAL NAZIN (النسخة المباشرة)
        files: REAL-NAZIN.apk
        body: "تطبيق REAL NAZIN - قم بتحميل ملف APK مباشرة واضغط عليه للتثبيت."